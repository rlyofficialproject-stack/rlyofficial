<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>आर एल वाई डिजिटल</title>
    <style>
        body { background-color: #1a2229; color: #e5e7eb; font-family: sans-serif; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .rly-frame { background: linear-gradient(135deg, #252a34, #1a1d24); border: 4px solid #b38f4d; box-shadow: 0 0 20px rgba(179,143,77,0.3); border-radius: 12px; width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; }
        .rly-header { text-align: center; border-bottom: 2px dashed #b38f4d; padding-bottom: 10px; margin-bottom: 15px; }
        .rly-logo { font-size: 26px; font-weight: bold; color: #ffd700; margin: 0; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: #ffd700; margin-bottom: 4px; text-align: left; }
        input { width: 100%; padding: 10px; background-color: #12141a; border: 1px solid #4a371c; border-radius: 6px; color: #fff; font-size: 15px; box-sizing: border-box; }
        .rly-btn { background: linear-gradient(180deg, #d4af37, #aa7c11); color: #12141a; border: none; width: 100%; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 8px; }
        .seal { font-size: 12px; color: #00ffcc; font-weight: bold; text-align: center; margin-top: 15px; }
        .card { background-color: #12141a; border: 1px solid #b38f4d; border-radius: 8px; padding: 15px; margin-top: 15px; }
        .result { margin-top: 10px; color: #00ffcc; font-size: 14px; text-align: left; line-height: 1.5; }
    </style>
</head>
<body>

<div class="rly-frame">
    <div class="rly-header">
        <h1 class="rly-logo">आर एल वाई डिजिटल</h1>
    </div>
    
    <div class="input-group">
        <label>ओनर संप्रभु आईडी</label>
        <input type="text" value="@rlyofficial.in" readonly style="background-color: #1a1d24; color: #ffd700; font-weight: bold; text-align: center;">
    </div>
    
    <div class="input-group">
        <label>मास्टर सुरक्षा ऑटो-पिन (६-अंक)</label>
        <input type="password" value="******" readonly>
    </div>

    <!-- Phase 1: Four-Wheeler Node Engines -->
    <div class="card">
        <h3 style="color:#ffd700; margin-top:0;">Toyota Fortuner Legender</h3>
        <input type="number" id="ftPrice" value="4300000" style="margin-bottom: 8px;">
        <button class="rly-btn" onclick="calc('ft', 0.18)">18% GST इनवॉइस जनरेट करें</button>
        <div id="ftOut" class="result"></div>
    </div>

    <div class="card">
        <h3 style="color:#ffd700; margin-top:0;">Mahindra Scorpio S11</h3>
        <input type="number" id="scPrice" value="1800000" style="margin-bottom: 8px;">
        <button class="rly-btn" onclick="calc('sc', 0.05)">5% GST इनवॉइस जनरेट करें</button>
        <div id="scOut" class="result"></div>
    </div>

    <div class="seal">🛡️ १००% विज्ञापन मुक्त (0% ADS) नोड सील</div>
</div>

<script>
    function calc(id, rate) {
        let val = parseFloat(document.getElementById(id + 'Price').value);
        if (isNaN(val) || val <= 0) { document.getElementById(id + 'Out').innerHTML = "कृपया वैध मूल्य दर्ज करें"; return; }
        let gst = val * rate; let total = val + gst;
        document.getElementById(id + 'Out').innerHTML = "<strong>GST राशि:</strong> ₹" + gst.toLocaleString('en-IN') + "<br><strong>कुल मूल्य (On-Road):</strong> ₹" + total.toLocaleString('en-IN');
    }
</script>

</body>
  </html>
